name: CI

on:
  push:
    branches: [main, master, guideliness]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache Natural Earth data
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-natural-earth-10m-v1-${{ runner.os }}-${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' "matplotlib<3.13"

      - name: Pre-fetch Natural Earth coastline data
        # The 10m land + coastline shapefiles used by several recipes are
        # downloaded lazily by cartopy. Pre-fetching them keeps CI output
        # reproducible and makes cache misses visible in the job timeline.
        run: |
          python - <<'PY'
          import cartopy.io.shapereader as shpreader
          for name in ('land', 'coastline'):
              shpreader.natural_earth(resolution='10m', category='physical', name=name)
          PY

      - name: Lint
        run: ruff check .

      - name: Type check
        run: python -m mypy -p sar_validation

      - name: Test
        run: pytest -q
