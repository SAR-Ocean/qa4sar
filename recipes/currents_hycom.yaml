name: currents_hycom
description: 'Validate Sentinel-1 WV mode ocean currents
  against HyCOM model surface currents (ESPC-D-V02).'
version: '1.0'
variable: currents
variable_specs:
  components:
  - zonal
  - meridional
geographic_bounds:
  min_lon: 0.5
  max_lon: 6.0
  min_lat: 58.0
  max_lat: 62.5
temporal_bounds:
  start: '2026-07-21'
  end: '2026-07-22'
sar_data:
  source: sentinel1_l2_ocn
  swath_mode:
  - WV
  - IW
  - EW
  - SM
  max_downloads: null
validation_sources:
- source_type: hycom
  download_kwargs: {}
  collocation_kwargs: {}
collocation:
  point_vs_layer:
    time_tolerance_minutes: 30
    spatial_tolerance_km: 25
    interpolation_method: nearest
    aggregation_window_km: 5.0
    validation_temporal_averaging_minutes: 30
    distance_weighting: gaussian
    gaussian_sigma_km: 2.0
  sar_footprint_radius_km: 14.0
  layer_vs_layer:
    layer_type_specs:
      hycom:
        time_tolerance_minutes: 360
        aggregation_window_km: 4.6
        distance_weighting: equal
        method: cell-averaging
        temporal_method: hyperbolic
    method: cell-averaging
output_dir: null
