name: currents_useastcoast
description: 'Validate Sentinel-1 WV mode ocean currents

  against HF radar and drifting buoys.'
version: '1.0'
variable: currents
variable_specs:
  components:
  - zonal
  - meridional
geographic_bounds:
  min_lon: -77.0
  max_lon: -68.0
  min_lat: 35.0
  max_lat: 44.0
temporal_bounds:
  start: '2026-07-14 10:30:00'
  end: '2026-07-14 10:50:00'
sar_data:
  satellite: Sentinel-1
  product_level: L2_OCN
  swath_mode:
  - WV
  - IW
  - EW
  - SM
  max_downloads: null
validation_sources:
- source_type: hf_radar_us
  download_kwargs: {}
  collocation_kwargs: {}
- source_type: drifter
  download_kwargs: {}
  collocation_kwargs: {}
- source_type: ferrybox
  download_kwargs: {}
  collocation_kwargs: {}
- source_type: mooring
  download_kwargs: {}
  collocation_kwargs: {}
collocation:
  point_vs_layer:
    time_tolerance_minutes: 30
    spatial_tolerance_km: 25
    interpolation_method: nearest
    aggregation_window_km: 5.0
    validation_temporal_averaging_minutes: 30
    distance_weighting: gaussian
    gaussian_sigma_km: 2.0
  sar_footprint_radius_km: 14.0
  layer_vs_layer:
    layer_type_specs:
      hf_radar_grid:
        time_tolerance_minutes: 30
        aggregation_window_km: 6.0
        distance_weighting: equal
        dedup_nearest_in_time: true
    method: cell-averaging
output_dir: null
