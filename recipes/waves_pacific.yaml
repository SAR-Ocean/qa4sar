name: waves_pacific
description: 'Validate Sentinel-1 significant wave height

  against moorings, tidal gauges, drifters, and altimeter.'
version: '1.0'
variable: waves
variable_specs:
  components:
  - significant_wave_height
geographic_bounds:
  min_lon: 135.0
  max_lon: -120.0
  min_lat: -15.0
  max_lat: 30.0
temporal_bounds:
  start: '2026-07-02'
  end: '2026-07-03'
sar_data:
  source: sentinel1_l2_ocn
  swath_mode:
  - WV
  - SM
  max_downloads: null
validation_sources:
- source_type: mooring
  download_kwargs: {}
  collocation_kwargs: {}
- source_type: tidal_gauge
  download_kwargs: {}
  collocation_kwargs: {}
- source_type: drifter
  download_kwargs: {}
  collocation_kwargs: {}
- source_type: altimeter
  download_kwargs: {}
  collocation_kwargs: {}
- source_type: era5
  download_kwargs: {}
  collocation_kwargs: {}
collocation:
  point_vs_layer:
    time_tolerance_minutes: 30
    spatial_tolerance_km: 25
    interpolation_method: nearest
    aggregation_window_km: 5.0
    validation_temporal_averaging_minutes: 30
    distance_weighting: gaussian
    gaussian_sigma_km: 2.0
  sar_footprint_radius_km: 14.0
  layer_vs_layer:
    layer_type_specs:
      era5_waves:
        time_tolerance_minutes: 120
        aggregation_window_km: 12.5
        distance_weighting: equal
        method: cell-averaging
        temporal_method: hyperbolic
      altimeter_1hz:
        time_tolerance_minutes: 180
        aggregation_window_km: 7.0
        distance_weighting: equal
      altimeter_5hz:
        time_tolerance_minutes: 180
        aggregation_window_km: 1.4
        distance_weighting: equal
    method: cell-averaging
output_dir: null
