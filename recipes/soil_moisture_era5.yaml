name: soil_moisture_era5
description: 'Validate Sentinel-1 CLMS Surface Soil Moisture against ERA5-Land
  reanalysis (volumetric_soil_water_level_1, uppermost 7cm, H-TESSEL).'
version: '1.0'
variable: soil_moisture
geographic_bounds:
  min_lon: -5.0
  max_lon: 5.0
  min_lat: 45.0
  max_lat: 52.0
temporal_bounds:
  start: '2026-07-10'
  end: '2026-07-12'
sar_data:
  source: sentinel1_clms_ssm
  max_downloads: null
validation_sources:
- source_type: era5
  download_kwargs: {}
  collocation_kwargs: {}
collocation:
  point_vs_layer:
    time_tolerance_minutes: 720
    spatial_tolerance_km: 25
    interpolation_method: nearest
    aggregation_window_km: 5.0
    validation_temporal_averaging_minutes: 30
    distance_weighting: gaussian
    gaussian_sigma_km: 2.0
  sar_footprint_radius_km: 14.0
  layer_vs_layer:
    layer_type_specs:
      era5_soil_moisture:
        time_tolerance_minutes: 720
        method: cell-averaging
        temporal_method: hyperbolic
        aggregation_window_km: 5.0
        distance_weighting: equal
    method: cell-averaging
output_dir: null
