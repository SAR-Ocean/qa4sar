name: currents_uswestcoast
description: 'Validate Sentinel-1 WV mode ocean currents

  against HF radar and drifting buoys.'
version: '1.0'
variable: currents
variable_specs:
  components:
  - zonal
  - meridional
geographic_bounds:
  min_lon: -130.0
  max_lon: -115.0
  min_lat: 33.0
  max_lat: 48.0
temporal_bounds:
  start: '2026-06-01 00:00:00'
  end: '2026-06-01 23:59:59'
sar_data:
  source: sentinel1_l2_ocn
  swath_mode:
  - WV
  - IW
  - EW
  - SM
  max_downloads: null
validation_sources:
- source_type: hf_radar_us
  download_kwargs: {}
  collocation_kwargs: {}
- source_type: drifter
  download_kwargs: {}
  collocation_kwargs: {}
- source_type: ferrybox
  download_kwargs: {}
  collocation_kwargs: {}
- source_type: mooring
  download_kwargs: {}
  collocation_kwargs: {}
- source_type: hycom
  download_kwargs: {}
  collocation_kwargs: {}
collocation:
  point_vs_layer:
    time_tolerance_minutes: 30
    spatial_tolerance_km: 25
    interpolation_method: nearest
    aggregation_window_km: 5.0
    validation_temporal_averaging_minutes: 30
    distance_weighting: gaussian
    gaussian_sigma_km: 2.0
  sar_footprint_radius_km: 14.0
  layer_vs_layer:
    layer_type_specs:
      hf_radar_grid:
        time_tolerance_minutes: 30
        aggregation_window_km: 6.0
        distance_weighting: equal
        dedup_nearest_in_time: true
    method: cell-averaging
output_dir: null
