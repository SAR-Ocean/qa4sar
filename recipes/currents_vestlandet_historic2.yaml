name: currents_vestlandet_historic2
description: 'Validate Sentinel-1 WV mode ocean currents

  against HF radar and drifting buoys.'
version: '1.0'
variable: currents
variable_specs:
  components:
  - zonal
  - meridional
geographic_bounds:
  min_lon: 0.5
  max_lon: 6.0
  min_lat: 58.0
  max_lat: 62.5
temporal_bounds:
  start: '2021-06-01'
  end: '2021-06-02'
sar_data:
  satellite: Sentinel-1
  product_level: L2_OCN
  swath_mode:
  - WV
  - IW
  - EW
  - SM
  max_downloads: null
validation_sources:
- source_type: hf_radar
  download_kwargs: {}
  collocation_kwargs: {}
- source_type: hf_radar_historical
  download_kwargs: {}
  collocation_kwargs: {}
- source_type: hf_radar_noaa
  min_depth: -2.0
  max_depth: 2.0
  download_kwargs:
    resolution_km: 6
  collocation_kwargs: {}
- source_type: drifter
  download_kwargs: {}
  collocation_kwargs: {}
- source_type: ferrybox
  download_kwargs: {}
  collocation_kwargs: {}
- source_type: mooring
  download_kwargs: {}
  collocation_kwargs: {}
- source_type: adcp_historical
  download_kwargs: {}
  collocation_kwargs: {}
- source_type: argo_historical
  download_kwargs: {}
  collocation_kwargs: {}
- source_type: drifter_historical
  download_kwargs: {}
  collocation_kwargs: {}
- source_type: glider_historical
  download_kwargs: {}
  collocation_kwargs: {}
collocation:
  point_vs_layer:
    time_tolerance_minutes: 30
    spatial_tolerance_km: 25
    interpolation_method: nearest
    aggregation_window_km: 5.0
    validation_temporal_averaging_minutes: 30
    distance_weighting: gaussian
    gaussian_sigma_km: 2.0
  sar_footprint_radius_km: 14.0
  layer_vs_layer:
    layer_type_specs:
      hf_radar_grid:
        time_tolerance_minutes: 30
        aggregation_window_km: 6.0
        distance_weighting: equal
        dedup_nearest_in_time: true
    method: cell-averaging
output_dir: null
