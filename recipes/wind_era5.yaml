name: wind_era5
description: 'Validate Sentinel-1 IW/EW mode wind speed and direction
  against ERA5 reanalysis (10m u/v wind components).'
version: '1.0'
variable: wind
variable_specs:
  components:
  - speed
  - direction
geographic_bounds:
  min_lon: -20.0
  max_lon: 0.0
  min_lat: 35.0
  max_lat: 60.0
temporal_bounds:
  start: '2026-07-12 18:00:00'
  end: '2026-07-12 23:00:00'
sar_data:
  source: sentinel1_l2_ocn
  swath_mode:
  - IW
  - EW
  max_downloads: null
validation_sources:
- source_type: era5
  download_kwargs: {}
  collocation_kwargs: {}
collocation:
  point_vs_layer:
    time_tolerance_minutes: 30
    spatial_tolerance_km: 25
    interpolation_method: nearest
    aggregation_window_km: 5.0
    validation_temporal_averaging_minutes: 30
    distance_weighting: gaussian
    gaussian_sigma_km: 2.0
  sar_footprint_radius_km: 14.0
  layer_vs_layer:
    layer_type_specs:
      era5_wind:
        method: cell-averaging
        temporal_method: hyperbolic
        aggregation_window_km: 12.5
        distance_weighting: equal
    method: cell-averaging
output_dir: null
