name: soil_moisture_nisar_norway
description: 'Validate NISAR SME2 (beta) L-band Surface Soil Moisture

  against ISMN in-situ stations, ASCAT, AMSR2, SMAP, and SMOS.'
version: '1.0'
variable: soil_moisture
variable_specs:
  components:
  - soil_moisture
geographic_bounds:
  min_lon: 5.0
  max_lon: 20.0
  min_lat: 57.0
  max_lat: 69.0
temporal_bounds:
  start: '2026-06-17 19:00:00'
  end: '2026-06-17 20:00:00'
sar_data:
  source: nisar_sme2
  swath_mode:
  - IW
  - EW
  max_downloads: null
  download_kwargs: {}
validation_sources:
- source_type: ismn
  min_depth: 0.0
  max_depth: 0.05
  download_kwargs: {}
  collocation_kwargs: {}
- source_type: ascat_ssm
  download_kwargs: {}
  collocation_kwargs: {}
- source_type: amsr_ssm
  download_kwargs: {}
  collocation_kwargs: {}
- source_type: smap_ssm
  download_kwargs: {}
  collocation_kwargs: {}
- source_type: smos_ssm
  download_kwargs: {}
  collocation_kwargs: {}
- source_type: cds_ssm
  download_kwargs:
    product_type: passive
  collocation_kwargs: {}
collocation:
  point_vs_layer:
    time_tolerance_minutes: 360
    spatial_tolerance_km: 2.0
    interpolation_method: nearest
    aggregation_window_km: 0.2
    validation_temporal_averaging_minutes: 30
    distance_weighting: equal
    gaussian_sigma_km: 2.0
  sar_footprint_radius_km: 14.0
  layer_vs_layer:
    layer_type_specs:
      scatterometer_ssm:
        time_tolerance_minutes: 360
      radiometer_ssm:
        time_tolerance_minutes: 360
      amsr_ssm:
        time_tolerance_minutes: 360
      smap_ssm:
        time_tolerance_minutes: 360
      smos_ssm:
        time_tolerance_minutes: 360
    method: cell-averaging
output_dir: null
