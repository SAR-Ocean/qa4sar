# Wave Height Validation Recipe
# Validates Sentinel-1 significant wave height against
# mooring observations and altimeter data.
#
# Usage:
#   sar-validate --recipe examples/waves_validation_example.yaml --dry-run
#   sar-validate --recipe examples/waves_validation_example.yaml

name: "Wave Height Validation — European West Coast"
description: |
  Validate Sentinel-1 WV mode significant wave height (Hs)
  against mooring observations, tidal gauges, drifters, and altimeter.

  Geographic region: European West Coast
  Time period: 2026-05-01 to 2026-05-02

version: "1.0"

variable: "waves"
variable_specs:
  components:
    - significant_wave_height   # Hs (m)

geographic_bounds:
  min_lon: -20
  max_lon:   0
  min_lat:  35
  max_lat:  60

temporal_bounds:
  start: "2026-05-01"
  end:   "2026-05-02"

sar_data:
  satellite: Sentinel-1
  product_level: L2_OCN
  swath_mode:
    - WV
  # max_downloads: 10

validation_sources:
  # In-situ moorings
  - source_type: mooring
    min_depth: -20
    max_depth:  20
    collocation_kwargs: {}

  # Tidal gauges
  - source_type: tidal_gauge
    min_depth: -20
    max_depth:  20
    collocation_kwargs: {}

  # Autonomous drifters
  - source_type: drifter
    min_depth: -20
    max_depth:  20
    collocation_kwargs: {}

  # Along-track altimeter (Copernicus Marine L3 SWH, both 1 Hz and 5 Hz)
  - source_type: altimeter

# point_vs_layer applies to moorings/tidal gauges/drifters (30 min / 12.5 km,
# the Abderrahim et al. 2019 / hal-04202202 standard). Altimeter's
# layer_vs_layer aggregation windows come from recipe.py's
# DEFAULT_LAYER_TYPE_SPECS (altimeter_1hz/altimeter_5hz) automatically.
collocation:
  point_vs_layer:
    time_tolerance_minutes: 30
    spatial_tolerance_km: 12.5
    interpolation_method: nearest
