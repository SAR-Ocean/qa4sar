# Ocean Currents Validation Recipe
# Validates Sentinel-1 WV mode surface currents against
# HF radar and drifting buoys / ferryboxes.
#
# Usage:
#   sar-validate --recipe examples/currents_validation_example.yaml --dry-run
#   sar-validate --recipe examples/currents_validation_example.yaml

name: "Ocean Currents Validation — European West Coast"
description: |
  Validate Sentinel-1 WV mode surface current retrievals
  against HF radar (coastal areas) and in-situ drifting buoys.

  Geographic region: European West Coast
  Time period: 2026-05-01 to 2026-05-02

version: "1.0"

variable: "currents"
variable_specs:
  components:
    - zonal      # East-West current (m/s)
    - meridional # North-South current (m/s)

geographic_bounds:
  min_lon: -20
  max_lon:   0
  min_lat:  35
  max_lat:  60

temporal_bounds:
  start: "2026-05-01"
  end:   "2026-05-02"

sar_data:
  satellite: Sentinel-1
  product_level: L2_OCN
  swath_mode:
    - WV
  # max_downloads: 10

validation_sources:
  # HF radar: high-resolution surface currents near coastlines
  - source_type: hf_radar
    min_depth: -2
    max_depth:  2

  # Drifting buoys
  - source_type: drifter
    min_depth: -20
    max_depth:  20
    collocation_kwargs: {}

  # Ferrybox data
  - source_type: ferrybox
    min_depth: -20
    max_depth:  20
    collocation_kwargs: {}

# point_vs_layer applies to drifters/ferryboxes (30 min / 12.5 km, the
# Abderrahim et al. 2019 / hal-04202202 standard); layer_vs_layer applies to
# HF radar (60 min / 5 km aggregation window).
collocation:
  point_vs_layer:
    time_tolerance_minutes: 30
    spatial_tolerance_km: 12.5
    interpolation_method: nearest
  layer_vs_layer:
    layer_type_specs:
      hf_radar:
        time_tolerance_minutes: 60
        aggregation_window_km: 5.0
        distance_weighting: equal
