# Wind Validation Recipe
# Validates Sentinel-1 IW/EW mode wind speed and direction against
# in-situ observations (moorings, buoys) and ASCAT scatterometer.
#
# Usage:
#   sar-validate --recipe examples/wind_validation_example.yaml --dry-run
#   sar-validate --recipe examples/wind_validation_example.yaml

name: "Wind Validation — European West Coast"
description: |
  Validate Sentinel-1 IW and EW mode wind speed and direction
  against moorings, buoys, and ASCAT scatterometer data.

  Geographic region: European West Coast
  Time period: 2026-05-01 to 2026-05-02

version: "1.0"

variable: "wind"
variable_specs:
  components:
    - speed
    - direction

geographic_bounds:
  min_lon: -20
  max_lon:   0
  min_lat:  35
  max_lat:  60

temporal_bounds:
  start: "2026-05-01"
  end:   "2026-05-02"

sar_data:
  satellite: Sentinel-1
  product_level: L2_OCN
  swath_mode:
    - IW
    - EW
  # max_downloads: 10  # uncomment to limit the number of SAR files

validation_sources:
  - source_type: mooring
    min_depth: -20
    max_depth:  20
    collocation_kwargs: {}

  - source_type: buoy
    min_depth: -20
    max_depth:  20
    collocation_kwargs: {}

  - source_type: scatterometer   # ASCAT MetOp-B/C via EUMETSAT EUMDAC

# Collocation strategy
# point_vs_layer applies to moorings/buoys (30 min / 12.5 km, the
# Abderrahim et al. 2019 / hal-04202202 standard); layer_vs_layer applies to
# scatterometer (180 min / 12.5 km aggregation window, same reference).
collocation:
  point_vs_layer:
    time_tolerance_minutes: 30
    spatial_tolerance_km: 12.5
    interpolation_method: nearest
  layer_vs_layer:
    layer_type_specs:
      scatterometer:
        time_tolerance_minutes: 180
        aggregation_window_km: 12.5
        distance_weighting: equal
