[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-l2-validation-toolbox"
version = "0.1.0"
description = "SAR Level 2 Ocean Data Validation Toolbox for wind, currents, and waves"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["SAR", "Sentinel-1", "ocean", "validation", "remote sensing"]

dependencies = [
    "xarray==2026.7.0",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "scipy==1.18.0",
    "netCDF4==1.7.4",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "keyring==25.7.0",
    "copernicusmarine==2.4.1",
    "rioxarray==0.23.0",
    "rasterio==1.5.1",
]

[project.optional-dependencies]
plot = ["matplotlib", "cartopy", "cmocean", "plotly", "folium"]
eumdac = ["eumdac"]
gportal = ["paramiko"]
# ERA5 reanalysis validation (wind/waves/soil_moisture recipes) needs only
# the CDS API client -- kept as its own small extra so a wind/waves-only
# ERA5 user isn't pointed at soil_moisture's unrelated, much heavier
# dependencies (pytesmo/ismn/earthaccess/ascat/pdbufr) just to get cdsapi.
era5 = ["cdsapi"]
soil_moisture = ["pytesmo", "ismn", "earthaccess", "ascat", "pdbufr", "pyorbital", "sar-l2-validation-toolbox[era5]"]
test = ["pytest", "pytest-cov"]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "ruff",
    "matplotlib",
    "cartopy",
    "cmocean",
    "plotly",
    "folium",
    "eumdac",
    "pytesmo",
    "ismn",
    "earthaccess",
    "ascat",
    "pdbufr",
    "paramiko",
    "cdsapi",
    "pyorbital",
]

[project.scripts]
sar-validate = "sar_validation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sar_validation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # cartopy 0.25's tick formatter reads Matplotlib's Formatter.locs,
    # deprecated in mpl 3.11 and removed in 3.13 (~3000 hits per CI run on
    # mpl 3.11; never fires on mpl <3.11). Remove this ignore together with
    # the matplotlib<3.13 pin in .github/workflows/ci.yml once cartopy
    # ships a fix.
    "ignore:The locs attribute was deprecated in Matplotlib 3.11:matplotlib.MatplotlibDeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Test modules deliberately import section-by-section (each downloader /
# component gets its own section with its own imports), so module-level
# imports below the top of the file are fine there.
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
# Only type-check this project's own code. Third-party scientific libs
# (xarray, zarr, copernicusmarine, eumdac, cartopy, …) are followed for
# imports but their own errors are suppressed — "silent" stops mypy choking
# on e.g. zarr's 3.12-only syntax, and ignore_missing_imports covers the
# stub-less packages.
follow_imports = "silent"
ignore_missing_imports = true
# Keep the first pass focused on real problems, not annotation coverage.
disallow_untyped_defs = false
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["tests/"]
