[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-l2-validation-toolbox"
version = "0.1.0"
description = "SAR Level 2 Ocean Data Validation Toolbox for wind, currents, and waves"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["SAR", "Sentinel-1", "ocean", "validation", "remote sensing"]

dependencies = [
    "xarray>=2024.1",
    "numpy",
    "pandas",
    "scipy",           # scipy.spatial.cKDTree — collocation nearest-neighbour search
    "netCDF4",         # xarray netcdf4 engine — datatree read/write in cli.py
    "pyyaml",
    "requests",
    "keyring",         # OS keyring credential storage — authenticate_* helpers in downloaders/base.py
    "copernicusmarine>=2.0",
    "rioxarray",       # GeoTIFF ingestion — Sentinel-1 CLMS Surface Soil Moisture
    "rasterio",        # rioxarray's raster I/O backend
]

[project.optional-dependencies]
plot = ["matplotlib", "cartopy", "cmocean", "plotly", "folium"]
eumdac = ["eumdac"]
gportal = ["paramiko"]
soil_moisture = ["pytesmo", "ismn", "earthaccess", "ascat", "pdbufr"]
test = ["pytest", "pytest-cov"]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "ruff",
    "matplotlib",
    "cartopy",
    "cmocean",
    "plotly",
    "folium",
    "eumdac",
    "pytesmo",
    "ismn",
    "earthaccess",
    "ascat",
    "pdbufr",
    "paramiko",
]

[project.scripts]
sar-validate = "sar_validation.cli:main"

[tool.setuptools.packages.find]
include = ["sar_validation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # cartopy 0.25's tick formatter reads Matplotlib's Formatter.locs,
    # deprecated in mpl 3.11 and removed in 3.13 (~3000 hits per CI run on
    # mpl 3.11; never fires on mpl <3.11). Remove this ignore together with
    # the matplotlib<3.13 pin in .github/workflows/ci.yml once cartopy
    # ships a fix.
    "ignore:The locs attribute was deprecated in Matplotlib 3.11:matplotlib.MatplotlibDeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Test modules deliberately import section-by-section (each downloader /
# component gets its own section with its own imports), so module-level
# imports below the top of the file are fine there.
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
# Only type-check this project's own code. Third-party scientific libs
# (xarray, zarr, copernicusmarine, eumdac, cartopy, …) are followed for
# imports but their own errors are suppressed — "silent" stops mypy choking
# on e.g. zarr's 3.12-only syntax, and ignore_missing_imports covers the
# stub-less packages.
follow_imports = "silent"
ignore_missing_imports = true
# Keep the first pass focused on real problems, not annotation coverage.
disallow_untyped_defs = false
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["tests/"]
