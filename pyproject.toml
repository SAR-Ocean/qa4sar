[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-l2-validation-toolbox"
version = "0.1.0"
description = "SAR Level 2 Ocean Data Validation Toolbox for wind, currents, and waves"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["SAR", "Sentinel-1", "ocean", "validation", "remote sensing"]

dependencies = [
    "xarray>=2024.1",
    "numpy",
    "pandas",
    "scipy",           # scipy.spatial.cKDTree — collocation nearest-neighbour search
    "pyyaml",
    "requests",
    "copernicusmarine>=2.0",
]

[project.optional-dependencies]
plot = ["matplotlib", "cartopy", "cmocean", "plotly", "folium"]
eumdac = ["eumdac"]
test = ["pytest", "pytest-cov"]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "matplotlib",
    "cartopy",
    "cmocean",
    "plotly",
    "folium",
    "eumdac",
]

[project.scripts]
sar-validate = "sar_validation.cli:main"

[tool.setuptools.packages.find]
include = ["sar_validation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
# Only type-check this project's own code. Third-party scientific libs
# (xarray, zarr, copernicusmarine, eumdac, cartopy, …) are followed for
# imports but their own errors are suppressed — "silent" stops mypy choking
# on e.g. zarr's 3.12-only syntax, and ignore_missing_imports covers the
# stub-less packages.
follow_imports = "silent"
ignore_missing_imports = true
# Keep the first pass focused on real problems, not annotation coverage.
disallow_untyped_defs = false
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["tests/"]
